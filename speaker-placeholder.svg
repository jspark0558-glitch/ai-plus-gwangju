  <!-- tie -->
  <path d="M200 292 l-9 -14 h18 z M200 292 l-10 46 l10 22 l10 -22 z" fill="#3a2d4d"/>

  <!-- neck -->
  <path d="M180 206 h40 v38 c0 11 -40 11 -40 0 z" fill="#54446c"/>

  <!-- ears -->
  <ellipse cx="145" cy="163" rx="9" ry="15" fill="#5e4d77"/>
  <ellipse cx="255" cy="163" rx="9" ry="15" fill="#5e4d77"/>

  <!-- face -->
  <path d="M200 88
           c-33 0 -53 25 -53 61
           c0 27 10 50 26 62
           c8 6 17 9 27 9
           s19 -3 27 -9
           c16 -12 26 -35 26 -62
           c0 -36 -20 -61 -53 -61 z" fill="url(#face)"/>

  <!-- hair -->
  <path d="M200 80
           c-40 0 -60 27 -59 64
           l7 12
           c-1 -26 4 -40 14 -49
           c10 7 24 10 38 10
           s28 -3 38 -10
           c10 9 15 23 14 49
           l7 -12
           c1 -37 -19 -64 -59 -64 z" fill="#352a47"/>
</svg>
