<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bb49e2"/>
      <stop offset="1" stop-color="#7d1ed2"/>
    </linearGradient>
    <linearGradient id="suit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#57496e"/>
      <stop offset="1" stop-color="#413353"/>
    </linearGradient>
    <radialGradient id="face" cx="0.5" cy="0.38" r="0.75">
      <stop offset="0" stop-color="#77658f"/>
      <stop offset="1" stop-color="#5e4d77"/>
    </radialGradient>
  </defs>

  <rect width="400" height="400" fill="url(#bg)"/>

  <!-- shoulders / suit -->
  <path d="M60 400
           c4 -78 40 -126 98 -144
           c12 13 72 13 84 0
           c58 18 94 66 98 144 z" fill="url(#suit)"/>
  <!-- shirt collar -->
  <path d="M176 252 l24 40 l24 -40
